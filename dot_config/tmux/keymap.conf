
# Bind Keys

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

bind k kill-pane
bind K kill-window

#
# ctrl+hjkl select pane
# <leader>q jump pane
# <leader>hjkl swap-pane
# <ctrl-[> select-window
# <ctrl-]> select-window
# <leader><ctrl-[> swap-window
# <leader><ctrl-]> swap-window
#

########
# Copy #
########

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

########
# Pane #
########
bind / split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind | split-window -f -h -c '#{pane_current_path}'
bind - split-window -f -v -c '#{pane_current_path}'

#bind j swap-pane -D
#bind k swap-pane -U

##########
# Window #
##########
bind -n C-[ swap-window -t -1 \; select-window -t -1
bind -n C-] swap-window -t +1 \; select-window -t +1

#bind c new-window -a -c "#{pane_current_path}"
##bind C                    confirm-before -p "kill-window #W? (y/n)" kill-window
##bind o                    confirm-before -p "kill-window #W? (y/n)" kill-window
## kill-window -t #W -a

##########
# Floats #
##########

## Lazygit
bind g display-popup -E -w 80% -h 80% -s 'bg=#e4e4e4,fg=#585858' -S 'fg=#0087af,bg=#e4e4e4' -b rounded -d '#{pane_current_path}' lazygit
