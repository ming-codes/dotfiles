
# Bind Keys

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

# C-hjkl navigate <- should not change this
# M-hjkl resize <- should not change this
# <leader>hjkl swap <- I hit this by accident and confuses the heck out of me
# <leader>c new tab

## Splits
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
# bind | split-window -f -h -c '#{pane_current_path}' # TODO split from root pane, I need better key for this
# bind - split-window -f -v -c '#{pane_current_path}' # TODO split from root pane, I need better key for this

bind j swap-pane -D
bind k swap-pane -U
bind h swap-window -d -t -1
bind l swap-window -d -t +1

bind c new-window -a -c "#{pane_current_path}"
#bind C                    confirm-before -p "kill-window #W? (y/n)" kill-window
#bind o                    confirm-before -p "kill-window #W? (y/n)" kill-window
# kill-window -t #W -a


bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

## Navigation

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

## Resize

# Edit values if you use custom resize_count variables
bind -n M-h if-shell "$is_vim" "send-keys M-h"  "resize-pane -L 10"
bind -n M-j if-shell "$is_vim" "send-keys M-j"  "resize-pane -D 5"
bind -n M-k if-shell "$is_vim" "send-keys M-k"  "resize-pane -U 5"
bind -n M-l if-shell "$is_vim" "send-keys M-l"  "resize-pane -R 10"

bind -T copy-mode-vi M-h resize-pane -L 10
bind -T copy-mode-vi M-j resize-pane -D 5
bind -T copy-mode-vi M-k resize-pane -U 5
bind -T copy-mode-vi M-l resize-pane -R 10

## Git

bind g display-popup -E -w 80% -h 80% -s 'bg=#e4e4e4,fg=#585858' -S 'fg=#0087af,bg=#e4e4e4' -b rounded -d '#{pane_current_path}' lazygit
